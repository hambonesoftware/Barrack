name: Verify Barrack graphics changes
on:
  pull_request:
    branches: [main]
    paths: ['web/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check browser modules
        run: |
          node --check web/app.mjs
          node --check web/render.mjs
          node --check web/retro96.mjs
      - name: Run engine, renderer and 60-seed balance tests
        run: node --test tests/engine.test.mjs tests/retro-theme.test.mjs tests/gameplay-fidelity.test.mjs
      - name: Install Chromium mobile test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile, tablet and desktop gameplay
        run: node --test tests/mobile-browser.test.mjs
      - name: Attach responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barrack-browser-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
